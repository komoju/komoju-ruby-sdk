name: Validate

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  validate:
    runs-on: [self-hosted, beta, public-release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.2'
      - name: Build gem
        run: gem build komoju-sdk.gemspec